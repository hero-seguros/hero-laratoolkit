name: tests

on:
  push:
    branches: [main, templates]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.0'
            name: 'PHP 8.2 / Laravel 11'
          - php: '8.3'
            testbench: '^9.0'
            name: 'PHP 8.3 / Laravel 11'
          - php: '8.3'
            testbench: '^10.0'
            name: 'PHP 8.3 / Laravel 12'
          - php: '8.4'
            testbench: '^10.0'
            name: 'PHP 8.4 / Laravel 12'

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-testbench${{ matrix.testbench }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-testbench${{ matrix.testbench }}-

      - name: Pin Testbench version for matrix
        run: composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Run Pest
        run: vendor/bin/pest --colors=always
